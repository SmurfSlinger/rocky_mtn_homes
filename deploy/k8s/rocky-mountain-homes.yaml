# Traefik (k3s) route: rockymountainhomesales.com → host Next.js on port 3002
# Port 443 on this server is handled by k3s Traefik (svclb), not Apache.
# Apply with: bash deploy/traefik-apply.sh
---
apiVersion: v1
kind: Service
metadata:
  name: rocky-mountain-homes
  namespace: default
spec:
  ports:
    - name: http
      port: 3002
      targetPort: 3002
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: rocky-mountain-homes
  namespace: default
subsets:
  - addresses:
      - ip: __HOST_IP__
    ports:
      - name: http
        port: 3002
        protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rocky-mountain-homes
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`rockymountainhomesales.com`) || Host(`www.rockymountainhomesales.com`)
      kind: Rule
      services:
        - name: rocky-mountain-homes
          port: 3002
  tls: {}
